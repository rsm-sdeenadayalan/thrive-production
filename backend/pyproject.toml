[project]
name = "rsm-django-thrive"
version = "0.1.0"
description = "THRIVE backend component (Rady MSBA)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "google-genai>=1.0",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "jsonschema>=4.22",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
