<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Matches --thrive-bg, so the browser chrome blends into the page. -->
		<meta name="theme-color" content="#faf9f5" />
		<!-- THRIVE is light-only by decision. Declaring it stops the browser from
		     auto-darkening native controls and scrollbars on a machine set to
		     dark, which would otherwise put dark form widgets on a warm-white
		     page. Mirrors `color-scheme: light` in app.css @layer base. -->
		<meta name="color-scheme" content="light" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
